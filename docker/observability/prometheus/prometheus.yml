# Prometheus (ADR-0059) — scrapes the Core's /metrics on the internal
# network. No METRICS_TOKEN is needed there: /metrics accepts private
# addresses, and the nginx sidecar refuses /metrics from the Internet.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: core-system
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8000']
        labels:
          service: app
