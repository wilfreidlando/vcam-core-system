server {
    listen 80;
    server_name _;

    # Used by the compose healthcheck and by nginx-proxy's own upstream
    # check — never logged, it fires continuously.
    location /up {
        access_log off;
        proxy_pass http://app:8000;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NOT $scheme — this hop is always plain HTTP (nginx-proxy already
        # terminated TLS before reaching this sidecar), so $scheme is
        # always "http" here regardless of what the browser used. That
        # clobbered the "https" nginx-proxy had already set, which made
        # Laravel's trustProxies think every request was insecure —
        # generating http:// URLs (e.g. the logout form action) even
        # though the page itself loaded over https, a real mixed-content
        # bug. Forward nginx-proxy's own header through unchanged instead.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Notification file/image endpoints accept content in the request
        # body — nginx's 1m default is too small for that.
        client_max_body_size 20m;
    }
}
