server {
    listen 80;
    server_name _;

    # Used by the compose healthcheck and by nginx-proxy's own upstream
    # check — never logged, it fires continuously.
    location /up {
        access_log off;
        proxy_pass http://app:8000;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Notification file/image endpoints accept content in the request
        # body — nginx's 1m default is too small for that.
        client_max_body_size 20m;
    }
}
