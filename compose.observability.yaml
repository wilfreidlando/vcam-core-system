# Observability stack (ADR-0059) — logs (Loki), traces (Tempo), metrics
# (Prometheus), one UI (Grafana), one collector (Grafana Alloy).
#
# Layered on top of the production stack, same project and same internal
# network, so Alloy reads the Core containers' logs and Prometheus scrapes
# `app:8000/metrics` without anything being published on the host:
#
#   docker compose -f compose.prod.yaml -f compose.observability.yaml up -d
#
# Then set in .env (and restart app/horizon/scheduler):
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
#   GRAFANA_URL=https://<GRAFANA_HOST>
#
# Grafana is published through the shared nginx-proxy at GRAFANA_HOST,
# behind its own login (GRAFANA_ADMIN_PASSWORD). Nothing else is exposed.
name: core-system-prod

services:
  alloy:
    image: grafana/alloy:v1.10.2
    container_name: core-system-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.5.5
    container_name: core-system-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./docker/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:2.8.2
    container_name: core-system-tempo
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - ./docker/observability/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: core-system-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    container_name: core-system-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:-grafana.localhost}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-ops@example.com}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-grafana@example.com}
      VIRTUAL_HOST: ${GRAFANA_HOST:-grafana.localhost}
      VIRTUAL_PORT: 3000
      LETSENCRYPT_HOST: ${GRAFANA_HOST:-grafana.localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - prometheus
    networks:
      - default
      - nginx-proxy

volumes:
  alloy-data:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
