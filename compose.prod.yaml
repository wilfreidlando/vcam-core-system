# Production deployment (ADR-0053) — separate from compose.yaml (local dev)
# rather than an override layer: the two share almost nothing (FrankenPHP vs
# `serve`, no published DB/Redis ports, the nginx-proxy sidecar, no bind
# mounts of the working tree) and diverging that much through overrides
# would be harder to read than two plain files.
#
# Usage on the VPS:
#   docker compose -f compose.prod.yaml build
#   docker compose -f compose.prod.yaml up -d
#   docker compose -f compose.prod.yaml exec app php artisan migrate --force
#
# Own project name so it never collides with a dev stack on the same host.
name: core-system-prod

services:
  app:
    build:
      context: .
      target: production
    container_name: core-system-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Thin reverse-proxy sidecar, one per project (matches this VPS's existing
  # convention) — bridges the shared external nginx-proxy network to this
  # project's own internal network. FrankenPHP already serves static files
  # and doesn't need nginx for that; this nginx exists purely for
  # VIRTUAL_HOST/LETSENCRYPT_HOST discovery and the reverse-proxy hop.
  webserver:
    image: nginx:alpine
    container_name: core-system-webserver
    restart: unless-stopped
    tty: true
    environment:
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./docker/nginx/prod:/etc/nginx/conf.d/:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - default
      - nginx-proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  horizon:
    build:
      context: .
      target: production
    container_name: core-system-horizon
    restart: unless-stopped
    command: php artisan horizon
    healthcheck:
      disable: true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    

  scheduler:
    build:
      context: .
      target: production
    container_name: core-system-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    healthcheck:
      disable: true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: core-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: core-system-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  valkey-data:

networks:
  # Project-local — app, horizon, scheduler, postgres and valkey never touch
  # the shared nginx-proxy network. Only `webserver` bridges the two:
  # putting postgres/valkey on the same network every other project on this
  # VPS shares would mean a compromised container in an unrelated project
  # could reach this Core's database directly, bypassing application auth
  # entirely — not an acceptable trade for a financial system.
  default:
    name: core-system-internal
  nginx-proxy:
    name: nginx-proxy
    external: true
