name: Nightly

# Gates that are too slow for a pull request but too valuable to skip.
# Running them nightly keeps PR feedback fast while still catching drift within
# a day of it appearing.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  IMAGE: core-system:nightly

jobs:
  module-graph:
    name: publish the module dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      - name: Render the graph
        run: |
          docker run --rm -v "$PWD:/var/www/html" -u "$(id -u):$(id -g)" ${{ env.IMAGE }} \
            bash -lc 'composer install --no-interaction --quiet &&
              vendor/bin/deptrac analyse --config-file=deptrac-modules.yaml \
                --formatter=graphviz-dot --output=module-graph.dot --no-progress'

      - uses: actions/upload-artifact@v4
        with:
          name: module-graph
          path: module-graph.dot

  # Mutation testing answers a question coverage cannot: do the tests actually
  # detect a wrong answer, or do they merely execute the code? Scoped to the
  # financial domain, where a silently-passing test is most expensive.
  # Activates when packages/ledger/src/Domain contains code (Lot 2).
  mutation:
    name: mutation testing (financial domain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there financial domain code yet?
        id: probe
        run: |
          if find packages/ledger/src/Domain packages/fees/src/Domain -name '*.php' 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ledger/fees domain code yet — mutation testing activates with Lot 2."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.probe.outputs.present == 'true'

      - uses: docker/build-push-action@v6
        if: steps.probe.outputs.present == 'true'
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      - name: Run Infection
        if: steps.probe.outputs.present == 'true'
        run: |
          docker run --rm -v "$PWD:/var/www/html" -u "$(id -u):$(id -g)" ${{ env.IMAGE }} \
            bash -lc 'composer install --no-interaction --quiet &&
              composer require --dev infection/infection --no-interaction --quiet &&
              vendor/bin/infection --threads=max --min-msi=80 --min-covered-msi=90'

  # Undeclared dependencies: a module that uses a package it never required
  # works by accident, until the package it borrowed from is removed.
  # Non-blocking for now: the checker needs a per-package symbol whitelist in a
  # path-repository monorepo, and tuning it is a week-two job, not a week-one one.
  undeclared-dependencies:
    name: undeclared dependencies (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha

      - name: Check each module manifest
        run: |
          docker run --rm -v "$PWD:/var/www/html" -u "$(id -u):$(id -g)" ${{ env.IMAGE }} \
            bash -lc 'composer install --no-interaction --quiet &&
              composer require --dev maglnet/composer-require-checker --no-interaction --quiet &&
              for module in packages/*/; do
                echo "── ${module}"
                vendor/bin/composer-require-checker check "${module}composer.json" || true
              done'
